# sch001.g0v.tw: 靜態站, 內容為 g0v/sch001-archive 的 gh-pages 分支 ( /home/web/projects/sch001/site ).
# 原 grantdash 的 /dash/* 已由典藏靜態頁取代, 不再需要後端.

server {
  listen 80;
  server_name sch001.g0v.tw;
  # let's encrypt webroot 驗證 ( /etc/letsencrypt/renewal/sch001.g0v.tw.conf )
  location ^~ /.well-known/acme-challenge/ {
    root /home/web/projects/sch001/site;
  }
  location / {
    return 301 https://$server_name$request_uri;
  }
}

server {
  # 443 須有帶憑證的 default server, 否則 nginx 1.14 在 SNI 前的握手會失敗
  listen 443 ssl default_server;
  server_name sch001.g0v.tw;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/sch001.g0v.tw/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sch001.g0v.tw/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/mime.types;
  charset utf-8;

  root /home/web/projects/sch001/site;
  index index.html;

  add_header Strict-Transport-Security "max-age=16070400; includeSubDomains";
  add_header X-Frame-Options "SAMEORIGIN";
  add_header Content-Security-Policy "frame-ancestors 'self' g0v.hackmd.io";

  location ~ /\.git { return 404; }

  # 原 grantdash 網址 /dash/brd/<slug>/list, /dash/prj/<slug> 無結尾斜線, 直接回傳目錄下的 index.html
  location / {
    try_files $uri $uri/index.html =404;
  }
}
